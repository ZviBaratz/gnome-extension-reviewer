# Field test extension manifest
# Each entry defines an extension source for batch ego-lint testing.
# Source types: local (path on disk), github (repo + optional ref), github-release (repo + tag)

extensions:
  - name: hara-hachi-bu
    uuid: hara-hachi-bu@ZviBaratz
    source:
      type: local
      path: ~/.local/share/gnome-shell/extensions/hara-hachi-bu@ZviBaratz
    baseline: true
    ego_approved: false

  - name: tiling-shell
    uuid: tilingshell@ferrarodomenico.com
