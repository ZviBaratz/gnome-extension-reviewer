    notes: "Correct advisory, disclosed in metadata"
  - id: "R-PREFS-04c::GTK layout widget advisory"
    classification: tp
    notes: "ListBox, SpinButton in prefs — correct advisory"
  - id: "R-SLOP-40::Promise wrapper advisory"
    classification: tp
    notes: "D-Bus proxy constructor — correct advisory"
  - id: "R-QUAL-33::Gio._promisify() module-scope"
    classification: tp
    notes: "Standard GJS pattern — correct advisory"
  - id: "R-VER48-04b::vertical property deprecated"
    classification: tp
    notes: "Correct advisory, deduplicated to 1 per file"
  - id: "metadata/shell-version-current::GNOME 49 not in shell-version"
